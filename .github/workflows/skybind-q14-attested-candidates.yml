# SB-Q14R2 private repository mode: signed candidate manifests via Ed25519 GitHub secret.
# Does not call GitHub Attestations API, publish public transparency metadata,
# or issue independent CFS1 G01-G08 / final release receipts.
name: Skybind Q14 signed candidate provenance (NOT A RELEASE)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  candidate-lanes:
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Go without cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          check-latest: false
          cache: false
      - name: Build both provider candidates from verified immutable Q04 input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/dev/integration/local_build.py --provider both \
            --output-parent "dist/q14/${{ matrix.lane }}"
      - name: Stage only verified candidate ZIPs and build-time receipt
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=(dist/q14/${{ matrix.lane }}/candidate-*/candidate-evidence.json)
          test "${#found[@]}" -eq 1
          folder="$(dirname "${found[0]}")"
          test -f "$folder/skybind-newfuture-CANDIDATE-UNQUALIFIED.zip"
          test -f "$folder/skybind-bclone-CANDIDATE-UNQUALIFIED.zip"
          mkdir -p "dist/q14/stage-${{ matrix.lane }}"
          cp "$folder/candidate-evidence.json" "$folder/skybind-newfuture-CANDIDATE-UNQUALIFIED.zip" \
            "$folder/skybind-bclone-CANDIDATE-UNQUALIFIED.zip" "dist/q14/stage-${{ matrix.lane }}/"
      - name: Sign original candidate hashes using private Ed25519 key (no GitHub attestation API)
        shell: bash
        env:
          SIGNING_KEY_B64: ${{ secrets.SKYBIND_Q14_ED25519_KEY_B64 }}
          EXPECTED_PUB_SHA256: ${{ vars.SKYBIND_Q14_SIGNER_PUBLIC_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEY_B64" || -z "$EXPECTED_PUB_SHA256" ]]; then
            echo 'Q14R2: configure SKYBIND_Q14_ED25519_KEY_B64 secret and SKYBIND_Q14_SIGNER_PUBLIC_SHA256 variable' >&2
            exit 2
          fi
          umask 077
          keyfile="$(mktemp "${RUNNER_TEMP}/skybind-q14-key.XXXXXXXX")"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$keyfile"
          python3 scripts/dev/release/q14_private_signing.py sign \
            --stage-dir "dist/q14/stage-${{ matrix.lane }}" --lane "${{ matrix.lane }}" \
            --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --key-file "$keyfile"
          printf '%s  %s\n' "$EXPECTED_PUB_SHA256" "dist/q14/stage-${{ matrix.lane }}/candidate-signer-public.pem" | sha256sum --check --status
          echo 'Signed candidate hashes and run identity (private GitHub Actions artifact; CFS1 remains blocked).'
      - name: Preserve raw lane outputs (signed subjects remain separately verifiable)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skybind-q14-candidate-${{ matrix.lane }}
          path: dist/q14/stage-${{ matrix.lane }}/
          retention-days: 30
          if-no-files-found: error

  compare-lanes:
    needs: candidate-lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout verifier source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retrieve separate lane artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: skybind-q14-candidate-*
          path: received
          merge-multiple: false
      - name: Verify checkout source cleanliness before writing reports
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Verify private signed manifests and pinned signer identity
        shell: bash
        env:
          EXPECTED_PUB_SHA256: ${{ vars.SKYBIND_Q14_SIGNER_PUBLIC_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_PUB_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'Missing pinned signing public key fingerprint' >&2; exit 2; }
          sha256sum --check --status <<< "$EXPECTED_PUB_SHA256  received/skybind-q14-candidate-A/candidate-signer-public.pem"
          cmp received/skybind-q14-candidate-A/candidate-signer-public.pem received/skybind-q14-candidate-B/candidate-signer-public.pem
          for lane in A B; do
            python3 scripts/dev/release/q14_private_signing.py verify \
              --stage-dir "received/skybind-q14-candidate-$lane" --lane "$lane" \
              --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
              --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --trusted-public-key received/skybind-q14-candidate-A/candidate-signer-public.pem
          done
          echo 'Both signatures valid against repository-configured signing fingerprint; independent CFS1 trust not implied.'
      - name: Verify raw candidates, compare bytes, inventory blocked gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/q14/report
          python3 scripts/dev/release/q13_reproducibility.py \
            --lane-a received/skybind-q14-candidate-A \
            --lane-b received/skybind-q14-candidate-B \
            --source-only --output-dir dist/q14/report
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('dist/q14/report/skybind-q13-summary.json').read_text())
          assert data['final_seal']=='NOT_ISSUED' and data['independent_attestation'] is False
          assert not data['issues'], data['issues']
          assert all(p['status']=='BYTE_IDENTICAL_UNATTESTED' for p in data['same_provider_repeat_build_comparison'].values())
          assert all(p['status']=='SHARED_PAYLOAD_MATCH_UNATTESTED' for p in data['cross_provider_shared_payload'])
          print('CANDIDATE_BYTE_IDENTICAL_WITH_PRIVATE_CI_SIGNATURES_NOT_INDEPENDENT_CFS1; G01-G08 still required')
          PY
      - name: Publish raw comparison and blocker report (no gate promotion)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skybind-q14-attested-comparison
          path: dist/q14/report/
          retention-days: 30
          if-no-files-found: error
