name: Skybind source validation (NOT release qualification)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Targeted source tests and release evidence denials
        run: bash scripts/devtool/check_c06_integration_release.sh
      - name: M3 disposable source and evidence denials (NO device mutation)
        run: |
          python3 -B scripts/dev/android/m3_disposable_source_gate.py
          python3 -B -m unittest discover -s tests -p 'test_m3_disposable_contract.py' -q
      - name: SB-Q02 source-build contract (no external gates)
        run: bash scripts/devtool/check_q02_source_build.sh
      - name: SB-Q03 raw provenance intake contract (no external gates)
        run: bash scripts/devtool/check_q03_source_provenance.sh
      - name: SB-Q03R1 trust-pin review contract (no external gates)
        run: bash scripts/devtool/check_q03r1_pin_review.sh
      - name: SB-Q04P2 selected upstream pins (NOT independent attestation)
        run: bash scripts/devtool/check_q04p2_pin_selection.sh
      - name: SB-Q04P3 pinned NDK installer exit-status and provenance contract
        run: bash scripts/devtool/check_q04p3_ndk_install.sh
      - name: SB-Q04P1 exact source-build to package binding (source-only)
        run: bash scripts/devtool/check_q04p1_build_binding.sh
