name: Skybind source validation (NOT release qualification)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Targeted source tests and release evidence denials
        run: bash scripts/devtool/check_c06_integration_release.sh
      - name: M3 disposable source and evidence denials (NO device mutation)
        run: |
          python3 -B scripts/dev/android/m3_disposable_source_gate.py
          python3 -B -m unittest discover -s tests -p 'test_m3_disposable_contract.py' -q
      - name: M3 consolidated copy and consumer source gates (NO device mutation)
        run: |
          python3 -B scripts/dev/android/m3_copy_source_gate.py
          python3 -B scripts/dev/android/m3_consumer_contract_gate.py
          python3 -B -m unittest discover -s tests -p 'test_m3_copy_consolidated.py' -q
      - name: R1 consumer policy / M3 scoped evidence source gates (NO external access)
        run: |
          python3 -B scripts/dev/android/r1_consumer_source_gate.py
          python3 -B -m unittest discover -s tests -p 'test_r1_consumer_access_contract.py' -q
          go test ./internal/brokergrant ./internal/brokeridentity ./internal/brokeripc ./internal/brokerissue ./internal/jobs ./internal/daemon
      - name: R1 trusted consumer identity and denied gateway source tests (NO listener)
        run: |
          python3 -B scripts/dev/android/r1_device_trust_source_gate.py
          python3 -B -m unittest discover -s tests -p 'test_r1_device_trust_source.py' -q
          go test -count=1 ./internal/brokergrant ./internal/brokeridentity ./internal/brokeripc ./internal/brokerissue
          # Root-owned module fixture is exercised explicitly on the hosted runner.
          sudo env PATH="$PATH" go test -count=1 ./internal/brokeridentity
      - name: SB-Q02 source-build contract (no external gates)
        run: bash scripts/devtool/check_q02_source_build.sh
      - name: SB-Q03 raw provenance intake contract (no external gates)
        run: bash scripts/devtool/check_q03_source_provenance.sh
      - name: SB-Q03R1 trust-pin review contract (no external gates)
        run: bash scripts/devtool/check_q03r1_pin_review.sh
      - name: SB-Q04P2 selected upstream pins (NOT independent attestation)
        run: bash scripts/devtool/check_q04p2_pin_selection.sh
      - name: SB-Q04P3 pinned NDK installer exit-status and provenance contract
        run: bash scripts/devtool/check_q04p3_ndk_install.sh
      - name: SB-Q04P1 exact source-build to package binding (source-only)
        run: bash scripts/devtool/check_q04p1_build_binding.sh
