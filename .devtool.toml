# Skybind — Devtool repository contract (bootstrap stage)
# Future SB-Oxx overlays add actual Go/build/WebUI/Android/device/release jobs.
# Bootstrap workflows validate the PLAN only. They do NOT seal the product.

[project]
runner = "command"
platform = "cli"

[workspace]
default_target = "skybind"

[workspace.groups]
source = ["skybind", "skybind_webui", "skybind_runtime_inputs"]
android = ["skybind_android_device", "skybind_app_probe"]
release_readiness = ["@source", "@android", "skybind_release"]
everything = ["*"]

[workspace.scheduler]
parallel = false
max_parallel_nodes = 3
max_android_device = 1
max_gradle_nodes = 1

[wrapper]
schema = 2
default_command = "bootstrap"

[wrapper.commands.bootstrap]
description = "Validate Skybind repository, roadmap and planned Devtool overlay graph (NOT product qualification)"
workflow = "bootstrap"
target = "skybind_release"

[wrapper.commands.contracts]
description = "Validate the 45 planned overlays and product identity"
workflow = "bootstrap"
target = "skybind"

[wrapper.commands.webui-plan]
description = "Check the original-WebUI parity plan, not actual visual parity"
workflow = "bootstrap"
target = "skybind_webui"

[wrapper.commands.runtime-plan]
description = "Check static runtime input plan, not runtime binaries"
workflow = "bootstrap"
target = "skybind_runtime_inputs"

[wrapper.commands.android-plan]
description = "Check device gate plan, not Android device evidence"
workflow = "bootstrap"
target = "skybind_android_device"

[wrapper.commands.release-plan]
description = "Check release gate dependency plan; does not issue a release seal"
workflow = "bootstrap"
target = "skybind_release"

# Source and CLI/daemon authority: implementation arrives in SB-O03 onward.
[wrapper.commands.r1-identity]
description = "B1-B source identity and grant issuance tests; no Android production trust asserted"
workflow = "r1-identity-source"
target = "skybind_release"

[targets.skybind]
runner = "command"
platform = "cli"
root = "."
inputs = [".devtool.toml", "docs/roadmap/**", "scripts/devtool/**", "tests/test_bootstrap.py", "cmd/**", "internal/**", "go.mod", "go.sum"]
outputs = ["build/**", "dist/**"]

[targets.skybind.jobs.bootstrap-contracts]
runner = "command"
command = ["python3", "-m", "unittest", "discover", "-s", "tests", "-p", "test_bootstrap.py", "-v"]
inputs = [".devtool.toml", "docs/roadmap/**", "scripts/devtool/**", "tests/test_bootstrap.py"]
metadata = { read_only = true, qualification = "bootstrap-plan-only" }

[targets.skybind.workflows]
personal-tests = ["job:personal-tests"]
personal-release-bclone = ["job:personal-release-bclone"]
personal-release-newfuture = ["job:personal-release-newfuture"]
personal-release-bclone-install = ["job:personal-release-bclone-install"]
personal-release-newfuture-install = ["job:personal-release-newfuture-install"]
local-build-newfuture = ["job:local-build-newfuture"]
local-build-bclone = ["job:local-build-bclone"]
local-build-both = ["job:local-build-both"]
local-build-newfuture-install = ["job:local-build-newfuture-install"]
local-build-bclone-install = ["job:local-build-bclone-install"]
local-runtime-newfuture = ["job:local-runtime-newfuture"]
local-runtime-bclone = ["job:local-runtime-bclone"]
native = ["job:foundation-go"]
q02-provider-source-contract = ["job:q02-provider-source-contract"]
q03-upstream-provenance-contract = ["job:q03-upstream-provenance-contract"]
q04p1-build-binding-contract = ["job:q04p1-build-binding-contract"]
q04p2-pin-selection-contract = ["job:q04p2-pin-selection-contract"]
q04p3-ndk-install-contract = ["job:q04p3-ndk-install-contract"]
q05-candidate-integration = ["job:q05-candidate-integration"]
q05p2-native-test-cross-compile = ["job:q05p2-native-test-cross-compile"]
q05p3-kernelsu-install-contract = ["job:q05p3-kernelsu-install-contract"]
q05p4-webui-esm-boot = ["job:q05p4-webui-esm-boot"]
q05p5-static-runtime-integrity = ["job:q05p5-static-runtime-integrity"]
q05p5-webui-runtime-diagnostics = ["job:q05p5-webui-runtime-diagnostics"]
repair-r01 = ["job:repair-r01-runtime-mount"]
repair-r02 = ["job:repair-r02-operation-ui"]
feature-parity-webui = ["job:fp01-webui-parity"]
feature-parity-provider = ["job:fp02-cli-provider-parity"]
feature-parity-platform = ["job:fp03-platform-parity"]
feature-parity-hotfix = ["job:fp-contract-hotfix"]
typed-control = ["job:typed-control-source"]
api-parity = ["job:api-parity-source"]
config-source = ["job:config-transaction-source"]
mount-source = ["job:mount-source-validation"]
integration-source = ["job:integration-source"]
android-platform = ["job:android-platform-source"]
jobs-providers = ["job:jobs-providers-source"]
diagnostics-transports = ["job:diagnostics-transports-source"]
contracts = ["job:foundation-contracts"]
bootstrap = ["job:bootstrap-contracts"]
validate = ["job:bootstrap-contracts"]

# Original WebUI assets must be copied directly and visually qualified in SB-O29..33.
# No UI parity is claimed by this bootstrap check.
[targets.skybind_webui]
runner = "command"
platform = "web"
root = "module/webroot"
inputs = ["../../docs/roadmap/**", "../../scripts/devtool/**", "**/*"]
outputs = []

[targets.skybind_webui.jobs.bootstrap-ui-plan]
runner = "command"
command = ["python3", "../../scripts/devtool/check_bootstrap.py", "webui"]
inputs = ["../../docs/roadmap/**", "../../scripts/devtool/**"]
metadata = { read_only = true, qualification = "planning-only" }

[targets.skybind_webui.workflows]
reference = ["job:reference-fidelity"]
bootstrap = ["job:bootstrap-ui-plan"]
validate = ["job:bootstrap-ui-plan"]

# Build-time NewFuture/bclone acquisition is added in dedicated overlays.
# No installed dynamic runtime selection, downloads or migrations.
[targets.skybind_runtime_inputs]
runner = "command"
platform = "shared"
root = "scripts/runtime"
inputs = ["../../docs/roadmap/**", "../../scripts/devtool/**", "**/*"]
outputs = ["../../build/runtime/**"]

[targets.skybind_runtime_inputs.jobs.bootstrap-runtime-plan]
runner = "command"
command = ["python3", "../devtool/check_bootstrap.py", "runtime"]
inputs = ["../../docs/roadmap/**", "../devtool/**"]
metadata = { read_only = true, qualification = "planning-only" }

[targets.skybind_runtime_inputs.workflows]
runtime-source = ["job:runtime-source-safety"]
bootstrap = ["job:bootstrap-runtime-plan"]
validate = ["job:bootstrap-runtime-plan"]

# Real ADB/root-manager tests require explicit later implementation + device evidence.
[targets.skybind_android_device]
runner = "command"
platform = "android"
root = "tests/device"
inputs = ["../../docs/roadmap/**", "../../scripts/devtool/**", "**/*"]
outputs = ["../../build/evidence/android/**"]

[targets.skybind_android_device.jobs.bootstrap-device-plan]
runner = "command"
command = ["python3", "../../scripts/devtool/check_bootstrap.py", "android"]
inputs = ["../../docs/roadmap/**", "../../scripts/devtool/**"]
metadata = { read_only = true, device_qualification = false, qualification = "planning-only" }

[targets.skybind_android_device.workflows]
b1c-consolidated-source = ["job:b1c-consolidated-source", "job:b1c-consolidated-plan"]
b1c3-identity-survey = ["job:b1c3-identity-survey"]
b1c-hosted-provenance = ["job:b1c-hosted-provenance"]
b1c-hosted-instrumentation = ["job:b1c-hosted-instrumentation"]
api-device-readonly = ["job:api-device-readonly"]
api-device-disposable = ["job:api-device-disposable"]
api-webview-gate = ["job:api-webview-gate"]
api-boot-prepare = ["job:api-boot-prepare"]
api-boot-verify = ["job:api-boot-verify"]
api-webui-interactive-prep = ["job:api-webui-interactive-prep"]
api-webui-interactive-gate = ["job:api-webui-interactive-gate"]
device-matrix-source = ["job:device-matrix-source"]
physical-app-probe = ["job:physical-app-probe"]
bootstrap = ["job:bootstrap-device-plan"]
validate = ["job:bootstrap-device-plan"]

# Composition target. Validation of planning != release qualification.
[targets.skybind_release]
runner = "command"
platform = "shared"
root = "release"
inputs = ["../docs/roadmap/**", "../scripts/devtool/**", "**/*"]
outputs = ["../dist/**", "../build/evidence/release/**"]

# B1-QW2: read-only planner guard; real A/B runs are explicit script stages.
[targets.skybind_release.jobs.r1-scheduler-plan]
runner = "command"
command = ["python3", "../scripts/dev/qualification/r1_scheduler_ab.py", "plan"]
inputs = ["../.devtool.toml", "../scripts/dev/qualification/r1_scheduler_ab.py"]
metadata = { read_only = true, qualification = "scheduler-plan-only-no-workload" }

[targets.skybind_release.jobs.bootstrap-release-plan]
runner = "command"
command = ["python3", "../scripts/devtool/check_bootstrap.py", "release"]
inputs = ["../docs/roadmap/**", "../scripts/devtool/**"]
metadata = { read_only = true, release_qualification = false, qualification = "planning-only" }

# R1 consumer grant/session policy is source-only; no external listener/grants.
[targets.skybind_release.jobs.r1-consumer-contract]
runner = "command"
command = ["python3", "-B", "../scripts/dev/android/r1_consumer_source_gate.py"]
inputs = ["../scripts/dev/android/r1_consumer_source_gate.py", "../internal/brokergrant/**", "../internal/brokeridentity/**", "../internal/brokeripc/**", "../internal/brokerissue/**", "../docs/contracts/rclone-compat/**", "../.devtool.toml"]
metadata = { read_only = true, external_transport_qualified = false, release_qualified = false }

[targets.skybind_release.jobs.r1-consumer-go]
runner = "command"
command = ["go", "-C", "..", "test", "-count=1", "./internal/brokergrant", "./internal/brokeridentity", "./internal/brokeripc", "./internal/brokerissue", "./internal/jobs", "./internal/daemon"]
inputs = ["../internal/brokergrant/**", "../internal/brokeridentity/**", "../internal/brokeripc/**", "../internal/brokerissue/**", "../internal/jobs/**", "../internal/daemon/**"]
metadata = { read_only = true, source_only = true, device_qualified = false }

[targets.skybind_release.jobs.r1-consumer-m3-evidence]
runner = "command"
command = ["python3", "-B", "-m", "unittest", "discover", "-s", "../tests", "-p", "test_r1_consumer_access_contract.py", "-q"]
inputs = ["../tests/test_r1_consumer_access_contract.py", "../scripts/dev/android/m3_evidence_reconcile.py"]
metadata = { read_only = true, no_automatic_device_retest = true, release_qualified = false }

[targets.skybind_release.jobs.r1-chrootctl-live-process-source]
runner = "command"
command = ["python3", "-B", "../scripts/dev/android/r1_chrootctl_device_source_gate.py"]
inputs = ["../scripts/dev/android/r1_chrootctl_device_source_gate.py", "../scripts/dev/android/r1_chrootctl_process_device.py", "../tests/test_r1_chrootctl_process_device.py"]
metadata = { source_only = true, no_device_mutation = true, no_grants = true, release_qualified = false }

[targets.skybind_release.jobs.r1-chrootctl-live-process-negatives]
runner = "command"
command = ["python3", "-B", "-m", "unittest", "discover", "-s", "../tests", "-p", "test_r1_chrootctl_process_device.py", "-q"]
inputs = ["../tests/test_r1_chrootctl_process_device.py", "../scripts/dev/android/r1_chrootctl_process_device.py"]
metadata = { source_only = true, simulated_device_receipts = true, no_grants = true }

[targets.skybind_release.workflows]
api01-native-rclone = ["job:api01-native-rclone"]
r1-chrootctl-process-source = [
  { id = "contract", ref = "job:r1-chrootctl-live-process-source", depends_on = [] },
  { id = "negative-receipts", ref = "job:r1-chrootctl-live-process-negatives", depends_on = ["contract"] },
]
r1-consumer-integration-source = [
  { id = "contract", ref = "job:r1-consumer-integration-contract", depends_on = [] },
  { id = "backend-and-grants", ref = "job:r1-consumer-integration-go", depends_on = ["contract"] },
  { id = "negative-regressions", ref = "job:r1-consumer-integration-python", depends_on = ["backend-and-grants"] },
  { id = "bridge-safety", ref = "job:r1-pm-channel-contract", depends_on = ["negative-regressions"] },
  { id = "no-auto-start", ref = "job:r1-consumer-transport-contract", depends_on = ["bridge-safety"] },
]

r1-consumer-transport-source = [
  { id = "transport-contract", ref = "job:r1-consumer-transport-contract", depends_on = [] },
  { id = "kernel-grants", ref = "job:r1-consumer-transport-go", depends_on = ["transport-contract"] },
  { id = "offline-denials", ref = "job:r1-consumer-transport-python", depends_on = ["kernel-grants"] },
  { id = "pm-bridge-regression", ref = "job:r1-pm-channel-contract", depends_on = ["offline-denials"] },
  { id = "cloud-build-policy", ref = "job:m3-operations-security", depends_on = ["pm-bridge-regression"] },
]

r1-pm-channel-source = [
  { id = "protocol-contract", ref = "job:r1-pm-channel-contract", depends_on = [] },
  { id = "go-protocol-negatives", ref = "job:r1-pm-channel-go", depends_on = ["protocol-contract"] },
  { id = "offline-device-negatives", ref = "job:r1-pm-channel-python", depends_on = ["go-protocol-negatives"] },
  { id = "module-identity-regression", ref = "job:r1-device-trust-go", depends_on = ["go-protocol-negatives"] },
  { id = "hosted-source-security", ref = "job:m3-operations-security", depends_on = ["offline-device-negatives", "module-identity-regression"] },
]

# R1 operator authorization and BKX PackageManager observation source only.
r1-trust-admission-source = [
  { id = "policy-contract", ref = "job:r1-trust-admission-contract", depends_on = [] },
  { id = "go-admission", ref = "job:r1-trust-admission-go", depends_on = ["policy-contract"] },
  { id = "python-negatives", ref = "job:r1-trust-admission-negatives", depends_on = ["go-admission"] },
  { id = "prior-trust", ref = "job:r1-device-trust-contract", depends_on = ["python-negatives"] },
  { id = "hosted-only", ref = "job:m3-operations-security", depends_on = ["prior-trust"] },
]
# Independently updated consumers are ABI/scoped-grant checked, not source-SHA pinned.
r1-consumer-foundation-source = [
  { id = "policy-contract", ref = "job:r1-consumer-contract", depends_on = [] },
  { id = "policy-go-tests", ref = "job:r1-consumer-go", depends_on = ["policy-contract"] },
  { id = "consumer-r0", ref = "job:m3-consumer-r0", depends_on = ["policy-contract", "policy-go-tests"] },
  { id = "m3-evidence-tests", ref = "job:r1-consumer-m3-evidence", depends_on = ["policy-contract", "policy-go-tests", "consumer-r0"] },
  { id = "m3-regression", ref = "job:m3-operations-unit", depends_on = ["policy-contract", "policy-go-tests", "consumer-r0", "m3-evidence-tests"] },
  { id = "hosted-only", ref = "job:m3-operations-security", depends_on = ["policy-contract", "policy-go-tests", "consumer-r0", "m3-evidence-tests", "m3-regression"] },
]
# Secure consumer identity and explicit-gateway source only; NO live listener.
r1-device-trust-source = [
  { id = "trust-contract", ref = "job:r1-device-trust-contract", depends_on = [] },
  { id = "go-trust-negatives", ref = "job:r1-device-trust-go", depends_on = ["trust-contract"] },
  { id = "python-negative-gates", ref = "job:r1-device-trust-negatives", depends_on = ["trust-contract", "go-trust-negatives"] },
  { id = "hosted-only-policy", ref = "job:m3-operations-security", depends_on = ["trust-contract", "go-trust-negatives", "python-negative-gates"] },
]

# Consolidated source-only M3 copy, reconnect/evidence and R0 cross-consumer gates.
m3-consolidated-source = [
  { id = "copy-contract", ref = "job:m3-copy-contract", depends_on = [] },
  { id = "consumer-r0", ref = "job:m3-consumer-r0", depends_on = ["copy-contract"] },
  { id = "negatives", ref = "job:m3-copy-negatives", depends_on = ["copy-contract", "consumer-r0"] },
  { id = "regression", ref = "job:m3-operations-unit", depends_on = ["copy-contract", "consumer-r0", "negatives"] },
  { id = "hosted-only", ref = "job:m3-operations-security", depends_on = ["copy-contract", "consumer-r0", "negatives", "regression"] },
]
m3-disposable-source = [
  { id = "guard", ref = "job:m3-disposable-contract", depends_on = [] },
  { id = "fixture-tests", ref = "job:m3-disposable-tests", depends_on = ["guard"] },
  { id = "regression", ref = "job:m3-operations-unit", depends_on = ["guard", "fixture-tests"] },
  { id = "hosted-policy", ref = "job:m3-operations-security", depends_on = ["guard", "fixture-tests", "regression"] },
]
m3-operations-source = [
  { id = "contract", ref = "job:m3-operations-contract", depends_on = [] },
  { id = "registry", ref = "job:m3-registry-contract", depends_on = ["contract"] },
  { id = "unit", ref = "job:m3-operations-unit", depends_on = ["contract", "registry"] },
  { id = "hosted-policy", ref = "job:m3-operations-security", depends_on = ["contract", "registry", "unit"] },
]
m2-lifecycle-source = [
  { id = "source", ref = "job:m2-lifecycle-source", depends_on = [] },
  { id = "unit", ref = "job:m2-lifecycle-unit", depends_on = ["source"] },
  { id = "security", ref = "job:m2-lifecycle-security", depends_on = ["source", "unit"] },
]
m2-negative-source = [
  { id = "source", ref = "job:m2-negative-source", depends_on = [] },
  { id = "negative-unit", ref = "job:m2-negative-unit", depends_on = ["source"] },
]
r1-hosted-source = ["job:r1-hosted-source"]

r1-scheduler-plan = ["job:r1-scheduler-plan"]
q16-source = ["job:q16-source"]
q17-negative-run = ["job:q17-negative-run"]
q15-readiness = ["job:q15-readiness"]
q14-attestation = ["job:q14-attestation"]
q13-reproducibility = ["job:q13-reproducibility"]
q12-provenance = ["job:q12-provenance"]
q11-reconcile = ["job:q11-reconcile"]
qualification-readiness = ["job:q01-gate-triage"]
final-audit = ["job:cfs1-audit-definition"]
personal-qualification = ["job:personal-qualification"]
cg1-definitions = ["job:cg1-gate-definitions"]
g03 = ["job:cg1-g03"]
g04 = ["job:cg1-g04"]
g05 = ["job:cg1-g05"]
g06 = ["job:cg1-g06"]
g07 = ["job:cg1-g07"]
g08 = ["job:cg1-g08"]
release-candidate-source = ["job:release-candidate-source"]
g01-definition = ["job:g01-definition"]
g02-definition = ["job:g02-definition"]
foundation = [
 { id = "contracts", ref = "target:skybind#contracts", depends_on = [] },
 { id = "webui", ref = "target:skybind_webui#reference", depends_on = ["contracts"] },
 { id = "planning", ref = "job:foundation-evidence", depends_on = ["webui"] },
]
bootstrap = [
  { id = "contracts", ref = "target:skybind#bootstrap", depends_on = [] },
  { id = "webui", ref = "target:skybind_webui#bootstrap", depends_on = ["contracts"] },
  { id = "runtime", ref = "target:skybind_runtime_inputs#bootstrap", depends_on = ["contracts"] },
  { id = "android", ref = "target:skybind_android_device#bootstrap", depends_on = ["contracts"] },
  { id = "plan", ref = "job:bootstrap-release-plan", depends_on = ["webui", "runtime", "android"] },
]
# Upgrade default validation from obsolete planning-only bootstrap to
# R1 source contracts; bootstrap remains separately available by name.
validate = [
  { id = "r1b", ref = "target:skybind_release#r1-identity-source", depends_on = [] },
]
# Non-mutating source DAG; no Android APK builds or device changes.
# Fast source-contract DAG: independent R0 consumer contracts and R1 broker
# policy are checked without requiring the unrelated full Go regression suite.
# This is not a full-source qualification or a device acceptance gate.
r0-compat = [
  { id = "bkx", ref = "target:skybind_bkx_compat#offline", depends_on = [] },
  { id = "chrootctl", ref = "target:skybind_chrootctl_compat#offline", depends_on = [] },
]
r1-source = [
  { id = "r0", ref = "target:skybind_release#r0-compat", depends_on = [] },
  { id = "grant", ref = "target:skybind_api_contracts#r1-policy", depends_on = [] },
]
# B1-A: source-bound, disabled-by-default read-only broker transport tests.
# Native Android build policy is independently checked; no APK builds here.
r1-transport-source = [
  { id = "contracts", ref = "target:skybind_release#r1-source", depends_on = [] },
  { id = "transport", ref = "target:skybind_api_contracts#r1-transport", depends_on = [] },
  { id = "android-policy", ref = "target:skybind_android_app#build-policy", depends_on = [] },
]
# B1-B: separate source authority tests. Android signing/binder authority still
# requires hosted APK + physical-device verification before external listeners.
r1-identity-source = [
  { id = "transport", ref = "target:skybind_release#r1-transport-source", depends_on = [] },
  { id = "identity", ref = "target:skybind_api_contracts#r1-identity", depends_on = [] },
  { id = "source-policy", ref = "target:skybind_api_contracts#r1b-contract", depends_on = [] },
]
# Required full regression; isolated Go packages remain mandatory.
r1-full-regression = [
  { id = "contracts", ref = "target:skybind_release#r1-identity-source", depends_on = [] },
  { id = "go", ref = "target:skybind_go#isolated-regression", depends_on = [] },
]

# Unchanged native GoRunner retained for reproducing Go/Termux WaitDelay.
# Not an acceptance gate while this intermittent host/tool failure is triaged.
r1-go-runner-diagnostic = [
  { id = "go-monolithic", ref = "target:skybind_go#test", depends_on = [] },
]

# First-class targeted test name used by Devtool test selectors and overlays.
[[test]]
id = "sb-bootstrap-contracts"
name = "Skybind planned contract and overlay dependency integrity (not product tests)"
runner = "command"
timeout_seconds = 90
command = ["python3", "-m", "unittest", "discover", "-s", "tests", "-p", "test_bootstrap.py", "-v"]

[artifacts]
output_directory = "dist"
output_name = "skybind"
collision = "unique"
verify = true

# SB-O01+SB-O02: executable source-contract and reference-fidelity checks.
# Never mistake these tests for completed UI/device/release gates.
[targets.skybind.jobs.foundation-contracts]
runner = "command"
command = ["python3", "-m", "unittest", "discover", "-s", "tests/contracts", "-p", "test_*.py", "-v"]
inputs = ["docs/contracts/**", "docs/architecture/**", "tests/contracts/**", "tests/fixtures/webui-reference/**"]
metadata = {read_only = true, qualification = "source-contract-only"}

[targets.skybind_webui.jobs.reference-fidelity]
runner = "command"
command = ["python3", "../../scripts/devtool/check_ui_reference.py"]
inputs = ["../../tests/fixtures/webui-reference/**", "../../tests/contracts/**", "../../scripts/devtool/check_ui_reference.py"]
metadata = {read_only = true, qualification = "byte-and-dom-baseline-only"}

[targets.skybind_release.jobs.foundation-evidence]
runner = "command"
command = ["python3", "../scripts/devtool/check_bootstrap.py", "release"]
inputs = ["../docs/roadmap/**", "../docs/contracts/**"]
metadata = {read_only = true, qualification = "planning-and-contract-only"}

[wrapper.commands.foundation]
description = "Validate frozen product contracts and original WebUI bytes; NOT visual/device qualification"
workflow = "foundation"
target = "skybind_release"

# SB-O03: isolated Go foundation validation. No runtime/device/release approval.
[targets.skybind.jobs.foundation-go]
runner = "command"
command = ["bash", "scripts/devtool/check_native.sh"]
inputs = ["go.mod", "cmd/skybind/**", "internal/paths/**", "internal/atomicfile/**", "internal/buildinfo/**", "scripts/devtool/check_native.sh"]
metadata = { read_only = true, qualification = "go-foundation-source-only" }

[wrapper.commands.native]
description = "Go filesystem-safety tests and linux/android arm64 cross-compile (source proof only)"
workflow = "native"
target = "skybind"

# SB-O04+O05: pinned build-time provider payloads, no installed runtime operation.
[targets.skybind_runtime_inputs.jobs.runtime-source-safety]
