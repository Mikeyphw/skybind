# Skybind — Devtool repository contract (bootstrap stage)
# Future SB-Oxx overlays add actual Go/build/WebUI/Android/device/release jobs.
# Bootstrap workflows validate the PLAN only. They do NOT seal the product.

[project]
runner = "command"
platform = "cli"

[workspace]
default_target = "skybind"

[workspace.groups]
source = ["skybind", "skybind_webui", "skybind_runtime_inputs"]
android = ["skybind_android_device"]
release_readiness = ["@source", "@android", "skybind_release"]
everything = ["*"]

[workspace.scheduler]
parallel = false
max_parallel_nodes = 3
max_android_device = 1
max_gradle_nodes = 1

[wrapper]
schema = 2
default_command = "bootstrap"

[wrapper.commands.bootstrap]
description = "Validate Skybind repository, roadmap and planned Devtool overlay graph (NOT product qualification)"
workflow = "bootstrap"
target = "skybind_release"

[wrapper.commands.contracts]
description = "Validate the 45 planned overlays and product identity"
workflow = "bootstrap"
target = "skybind"

[wrapper.commands.webui-plan]
description = "Check the original-WebUI parity plan, not actual visual parity"
workflow = "bootstrap"
target = "skybind_webui"

[wrapper.commands.runtime-plan]
description = "Check static runtime input plan, not runtime binaries"
workflow = "bootstrap"
target = "skybind_runtime_inputs"

[wrapper.commands.android-plan]
description = "Check device gate plan, not Android device evidence"
workflow = "bootstrap"
target = "skybind_android_device"

[wrapper.commands.release-plan]
description = "Check release gate dependency plan; does not issue a release seal"
workflow = "bootstrap"
target = "skybind_release"

# Source and CLI/daemon authority: implementation arrives in SB-O03 onward.
[targets.skybind]
runner = "command"
platform = "cli"
root = "."
inputs = [".devtool.toml", "docs/roadmap/**", "scripts/devtool/**", "tests/test_bootstrap.py", "cmd/**", "internal/**", "go.mod", "go.sum"]
outputs = ["build/**", "dist/**"]

[targets.skybind.jobs.bootstrap-contracts]
runner = "command"
command = ["python3", "-m", "unittest", "discover", "-s", "tests", "-p", "test_bootstrap.py", "-v"]
inputs = [".devtool.toml", "docs/roadmap/**", "scripts/devtool/**", "tests/test_bootstrap.py"]
metadata = { read_only = true, qualification = "bootstrap-plan-only" }

[targets.skybind.workflows]
native = ["job:foundation-go"]
typed-control = ["job:typed-control-source"]
api-parity = ["job:api-parity-source"]
config-source = ["job:config-transaction-source"]
mount-source = ["job:mount-source-validation"]
android-platform = ["job:android-platform-source"]
jobs-providers = ["job:jobs-providers-source"]
diagnostics-transports = ["job:diagnostics-transports-source"]
contracts = ["job:foundation-contracts"]
bootstrap = ["job:bootstrap-contracts"]
validate = ["job:bootstrap-contracts"]

# Original WebUI assets must be copied directly and visually qualified in SB-O29..33.
# No UI parity is claimed by this bootstrap check.
[targets.skybind_webui]
runner = "command"
platform = "web"
root = "module/webroot"
inputs = ["../../docs/roadmap/**", "../../scripts/devtool/**", "**/*"]
outputs = []

[targets.skybind_webui.jobs.bootstrap-ui-plan]
runner = "command"
command = ["python3", "../../scripts/devtool/check_bootstrap.py", "webui"]
inputs = ["../../docs/roadmap/**", "../../scripts/devtool/**"]
metadata = { read_only = true, qualification = "planning-only" }

[targets.skybind_webui.workflows]
reference = ["job:reference-fidelity"]
bootstrap = ["job:bootstrap-ui-plan"]
validate = ["job:bootstrap-ui-plan"]

# Build-time NewFuture/bclone acquisition is added in dedicated overlays.
# No installed dynamic runtime selection, downloads or migrations.
[targets.skybind_runtime_inputs]
runner = "command"
platform = "shared"
root = "scripts/runtime"
inputs = ["../../docs/roadmap/**", "../../scripts/devtool/**", "**/*"]
outputs = ["../../build/runtime/**"]

[targets.skybind_runtime_inputs.jobs.bootstrap-runtime-plan]
runner = "command"
command = ["python3", "../devtool/check_bootstrap.py", "runtime"]
inputs = ["../../docs/roadmap/**", "../devtool/**"]
metadata = { read_only = true, qualification = "planning-only" }

[targets.skybind_runtime_inputs.workflows]
runtime-source = ["job:runtime-source-safety"]
bootstrap = ["job:bootstrap-runtime-plan"]
validate = ["job:bootstrap-runtime-plan"]

# Real ADB/root-manager tests require explicit later implementation + device evidence.
[targets.skybind_android_device]
runner = "command"
platform = "android"
root = "tests/device"
inputs = ["../../docs/roadmap/**", "../../scripts/devtool/**", "**/*"]
outputs = ["../../build/evidence/android/**"]

[targets.skybind_android_device.jobs.bootstrap-device-plan]
runner = "command"
command = ["python3", "../../scripts/devtool/check_bootstrap.py", "android"]
inputs = ["../../docs/roadmap/**", "../../scripts/devtool/**"]
metadata = { read_only = true, device_qualification = false, qualification = "planning-only" }

[targets.skybind_android_device.workflows]
bootstrap = ["job:bootstrap-device-plan"]
validate = ["job:bootstrap-device-plan"]

# Composition target. Validation of planning != release qualification.
[targets.skybind_release]
runner = "command"
platform = "shared"
root = "release"
inputs = ["../docs/roadmap/**", "../scripts/devtool/**", "**/*"]
outputs = ["../dist/**", "../build/evidence/release/**"]

[targets.skybind_release.jobs.bootstrap-release-plan]
runner = "command"
command = ["python3", "../scripts/devtool/check_bootstrap.py", "release"]
inputs = ["../docs/roadmap/**", "../scripts/devtool/**"]
metadata = { read_only = true, release_qualification = false, qualification = "planning-only" }

[targets.skybind_release.workflows]
g01-definition = ["job:g01-definition"]
g02-definition = ["job:g02-definition"]
foundation = [
 { id = "contracts", ref = "target:skybind#contracts", depends_on = [] },
 { id = "webui", ref = "target:skybind_webui#reference", depends_on = ["contracts"] },
 { id = "planning", ref = "job:foundation-evidence", depends_on = ["webui"] },
]
bootstrap = [
  { id = "contracts", ref = "target:skybind#bootstrap", depends_on = [] },
  { id = "webui", ref = "target:skybind_webui#bootstrap", depends_on = ["contracts"] },
  { id = "runtime", ref = "target:skybind_runtime_inputs#bootstrap", depends_on = ["contracts"] },
  { id = "android", ref = "target:skybind_android_device#bootstrap", depends_on = ["contracts"] },
  { id = "plan", ref = "job:bootstrap-release-plan", depends_on = ["webui", "runtime", "android"] },
]
validate = ["job:bootstrap-release-plan"]

# First-class targeted test name used by Devtool test selectors and overlays.
[[test]]
id = "sb-bootstrap-contracts"
name = "Skybind planned contract and overlay dependency integrity (not product tests)"
runner = "command"
timeout_seconds = 90
command = ["python3", "-m", "unittest", "discover", "-s", "tests", "-p", "test_bootstrap.py", "-v"]

[artifacts]
output_directory = "dist"
output_name = "skybind"
collision = "unique"
verify = true

# SB-O01+SB-O02: executable source-contract and reference-fidelity checks.
# Never mistake these tests for completed UI/device/release gates.
[targets.skybind.jobs.foundation-contracts]
runner = "command"
command = ["python3", "-m", "unittest", "discover", "-s", "tests/contracts", "-p", "test_*.py", "-v"]
inputs = ["docs/contracts/**", "docs/architecture/**", "tests/contracts/**", "tests/fixtures/webui-reference/**"]
metadata = {read_only = true, qualification = "source-contract-only"}

[targets.skybind_webui.jobs.reference-fidelity]
runner = "command"
command = ["python3", "../../scripts/devtool/check_ui_reference.py"]
inputs = ["../../tests/fixtures/webui-reference/**", "../../tests/contracts/**", "../../scripts/devtool/check_ui_reference.py"]
metadata = {read_only = true, qualification = "byte-and-dom-baseline-only"}

[targets.skybind_release.jobs.foundation-evidence]
runner = "command"
command = ["python3", "../scripts/devtool/check_bootstrap.py", "release"]
inputs = ["../docs/roadmap/**", "../docs/contracts/**"]
metadata = {read_only = true, qualification = "planning-and-contract-only"}

[wrapper.commands.foundation]
description = "Validate frozen product contracts and original WebUI bytes; NOT visual/device qualification"
workflow = "foundation"
target = "skybind_release"

# SB-O03: isolated Go foundation validation. No runtime/device/release approval.
[targets.skybind.jobs.foundation-go]
runner = "command"
command = ["bash", "scripts/devtool/check_native.sh"]
inputs = ["go.mod", "cmd/skybind/**", "internal/paths/**", "internal/atomicfile/**", "internal/buildinfo/**", "scripts/devtool/check_native.sh"]
metadata = { read_only = true, qualification = "go-foundation-source-only" }

[wrapper.commands.native]
description = "Go filesystem-safety tests and linux/android arm64 cross-compile (source proof only)"
workflow = "native"
target = "skybind"

# SB-O04+O05: pinned build-time provider payloads, no installed runtime operation.
[targets.skybind_runtime_inputs.jobs.runtime-source-safety]
runner = "command"
command = ["bash", "../devtool/check_runtime_source.sh"]
inputs = ["../runtime/**", "../../internal/integrity/**", "../../internal/runtimeauth/**", "../../tests/package/**", "../devtool/check_runtime_source.sh"]
metadata = { read_only = true, qualification = "source-fixture-only", device_qualification = false }



[wrapper.commands.runtime-source]
description = "Check build-time provider input guards using artificial ELF fixtures (not official upstream build qualification)"
workflow = "runtime-source"
target = "skybind_runtime_inputs"

# SB-G01: gate definition self-tests; real gate remains blocked until evidence.
[targets.skybind_release.jobs.g01-definition]
runner = "command"
command = ["python3", "-m", "unittest", "discover", "-s", "../tests/gates", "-p", "test_*.py", "-v"]
inputs = ["../scripts/dev/gates/**", "../tests/gates/**", "../docs/gates/SB-G01.md"]
metadata = { read_only = true, qualification = "gate-definition-only", actual_gate_pass = false }

[wrapper.commands.g01-definition]
description = "Verify SB-G01 fail-closed gate definition, NOT supply-chain certification"
workflow = "g01-definition"
target = "skybind_release"

# SB-O06+O07: typed control and operation journal source checks only.
[targets.skybind.jobs.typed-control-source]
runner = "command"
command = ["bash", "scripts/devtool/check_control.sh"]
inputs = ["internal/protocol/**", "internal/control/**", "internal/daemon/**", "internal/previewproof/**", "internal/journal/**", "scripts/devtool/check_control.sh"]
metadata = { read_only = true, qualification = "source-only", gate_g01 = "BLOCKED" }

[wrapper.commands.typed-control]
description = "SB-O06+O07 typed control source test (NOT G01 promotion)"
workflow = "typed-control"
target = "skybind"



# SB-O08: transactional configuration source gate; not Android gate or G01 seal.
[targets.skybind.jobs.config-transaction-source]
runner = "command"
command = ["bash", "scripts/devtool/check_config.sh"]
inputs = ["internal/mounts/config/**", "internal/previewproof/**", "scripts/devtool/check_config.sh"]
metadata = { read_only = true, qualification = "source-only", gate_g01 = "BLOCKED" }

# SB-O09: complete typed API catalog, CLI routing and effective config RPC.
[targets.skybind.jobs.api-parity-source]
runner = "command"
command = ["bash", "scripts/devtool/check_api_parity.sh"]
inputs = ["cmd/skybind/**", "internal/control/**", "internal/daemon/**", "internal/mounts/config/**", "internal/protocol/**", "docs/contracts/typed-operations.json", "tests/cli/**", "scripts/devtool/check_api_parity.sh"]
metadata = { read_only = true, qualification = "source-only", gate_g01 = "BLOCKED" }

[wrapper.commands.api-parity]
description = "Verify frozen 57-operation inventory, CLI/backend parity, config RPC and negative tests; source-only"
workflow = "api-parity"
target = "skybind"

# SB-G02: independently test the fail-closed gate definition, never silently
# promote a milestone while SB-G01 has no verified upstream evidence.
[targets.skybind_release.jobs.g02-definition]
runner = "command"
command = ["bash", "../scripts/devtool/check_g02_definition.sh"]
inputs = ["../scripts/dev/gates/sb_g02.py", "../tests/gates/test_g02.py", "../docs/gates/SB-G02.md", "../scripts/devtool/check_g02_definition.sh", "../internal/**", "../cmd/skybind/**"]
metadata = { read_only = true, qualification = "gate-definition-only", actual_gate_pass = false }

[wrapper.commands.g02-definition]
description = "Test SB-G02 independent blocked gate, not actual source promotion"
workflow = "g02-definition"
target = "skybind_release"

# SB-C01 native mount lifecycle, supervisor, Android policies and owned cache.
# This job is invoked by the overlay validation; no operator-run tests required.
[targets.skybind.jobs.mount-source-validation]
runner = "command"
command = ["bash", "scripts/devtool/check_mount_engine.sh"]
inputs = ["go.mod", "cmd/skybind/**", "internal/mounts/**", "internal/daemon/**", "scripts/devtool/check_mount_engine.sh", "tests/mounts/**", "docs/roadmap/**"]
metadata = {read_only = true, qualification = "source-only", gate_g01 = "BLOCKED", gate_g02 = "BLOCKED", android_device = "NOT_ATTESTED"}

[wrapper.commands.mount-source]
description = "SB-C01 source-only mount/cache/supervisor security tests; NOT device or gate qualification"
workflow = "mount-source"
target = "skybind"

[[test]]
id = "sb-c01-mount-engine"
name = "SB-C01 owned FUSE mount engine and cache security"
runner = "command"
timeout_seconds = 300
command = ["bash", "scripts/devtool/check_mount_engine.sh"]

# SB-C02: all namespace/mount, manager and uninstall validation is run by
# Devtool itself as part of atomic apply. This is SOURCE ONLY.
[targets.skybind.jobs.android-platform-source]
runner = "command"
command = ["bash", "scripts/devtool/check_android_platform.sh"]
inputs = ["internal/namespace/**", "internal/rootmgr/**", "internal/platformlifecycle/**", "module/**", "cmd/skybind/**", "internal/daemon/**", "tests/platform/**", "docs/contracts/SB-C02_ANDROID_PLATFORM.md", "scripts/devtool/check_android_platform.sh"]
metadata = {read_only = true, qualification = "android-source-fixture-only", device_qualification = false, gate_g04 = "BLOCKED"}

[wrapper.commands.android-platform]
description = "SB-C02 namespace and root-manager source tests; real device NOT certified"
workflow = "android-platform"
target = "skybind"


[[test]]
id = "sb-c02-android-platform"
name = "SB-C02 bounded namespace, root manager hooks and safe uninstall"
runner = "command"
timeout_seconds = 300
command = ["bash", "scripts/devtool/check_android_platform.sh"]

# SB-C03 — jobs, credential-isolated provider operations and per-mount RC.
# Devtool automatically executes this validator while applying the artifact.
[targets.skybind.jobs.jobs-providers-source]
runner = "command"
command = ["bash", "scripts/devtool/check_jobs_providers.sh"]
inputs = ["internal/jobs/**", "internal/provider/**", "internal/rc/**", "internal/daemon/**", "internal/mounts/lifecycle/**", "cmd/skybind/**", "tests/jobs/**", "docs/contracts/SB-C03_JOBS_PROVIDERS.md", "scripts/devtool/check_jobs_providers.sh", "docs/roadmap/**"]
metadata = {read_only = true, qualification = "source-only", gates = "BLOCKED", device_qualification = false}

[wrapper.commands.jobs-providers]
description = "SB-C03 typed jobs, bounded providers and RC source/security tests; no device or gate seal"
workflow = "jobs-providers"
target = "skybind"

[[test]]
id = "sb-c03-jobs-providers"
name = "SB-C03 scheduled jobs, remote crypt and authenticated RC negative gates"
runner = "command"
timeout_seconds = 360
command = ["bash", "scripts/devtool/check_jobs_providers.sh"]

# SB-C04: production source qualification, NOT Android device or WebUI parity proof.
[targets.skybind.jobs.diagnostics-transports-source]
runner = "command"
command = ["bash", "scripts/devtool/check_diagnostics_transports.sh"]
inputs = ["internal/diagnostics/**", "internal/doctor/**", "internal/support/**", "internal/webui/**", "internal/daemon/**", "cmd/skybind/**", "tests/diagnostics/**", "scripts/devtool/check_diagnostics_transports.sh"]
metadata = {qualification = "source-only", android_device = false, visual_parity = false, release_seal = false}
